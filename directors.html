<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Groove - Directors</title>
    <link rel="icon" type="image/svg+xml" href="Asset 1.svg">
    <link rel="stylesheet" href="styledirectors.css">
</head>
<body>

    <!-- Overlay de Navegação Fullscreen -->
    <div class="nav-overlay" id="nav-overlay">
        <button class="nav-close" id="nav-close" aria-label="Fechar menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>
        <nav class="nav-content">
            <a href="index.html">home</a>
            <a href="directors.html" class="active">directors</a>
            <a href="photographers.html">photographers</a>
            <a href="filmtv.html">film & tv</a>
            <a href="international.html">international</a>
            <a href="https://spritz.com.br/" target="_blank" rel="noopener">spritz</a>
            <a href="us.html">us.</a>
            <a href="contact.html">contact</a>
        </nav>
    </div>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="logo-container" id="logo-toggle">
            <img src="Asset 1.svg" alt="B Groove Logo">
        </div>
        <a href="index.html" class="home-link">home</a>
        <a href="about.html" class="about-link">ABOUT</a>
    </header>

    <!-- Vídeo de fundo aleatório (Menu Inicial) -->
    <div class="menu-bg-video" id="menu-bg-video"></div>

    <!-- Submenu de Diretores (Menu Inicial) -->
    <nav class="directors-submenu" id="directors-submenu">
        <a href="#" class="director-link" data-director="andre-chitas">André Chitas</a>
        <a href="#" class="director-link" data-director="goncalo-xz">Gonçalo Xz</a>
        <a href="#" class="director-link" data-director="ines-monteiro">Inês Monteiro</a>
    </nav>

    <!-- Visão do Diretor (Container com Scroll Vertical) -->
    <div class="director-view" id="director-view">
        
        <!-- Secção 1: Vídeo em Ecrã Inteiro -->
        <div class="video-section">
            
            <div class="main-iframe-wrapper" id="main-iframe-wrapper"></div>
            
            <!-- BOTÃO VOLTAR AOS DIRETORES (Agora dentro do video-section) -->
            <button class="back-to-menu" id="back-to-menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to directors
            </button>

            <!-- Callouts fixos na secção do vídeo -->
            <div class="side-callout left">call a friend.</div>
            <div class="side-callout right">call a friend.</div>

            <!-- Setas de Navegação do Vídeo -->
            <button class="nav-arrow left-arrow" id="prev-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <button class="nav-arrow right-arrow" id="next-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <div class="video-info-center">
                <div class="dir-name" id="main-dir-name">Dir.</div>
                <div class="brand-name" id="main-brand-name">Marca</div>
            </div>

            <!-- Botão para baixo (Atalho para o Carrossel) -->
            <div class="down-chevron" id="down-chevron">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>

        <!-- Secção 2: Carrossel (Fundo Preto) -->
        <div class="carousel-section">
            
            <!-- SETA PARA CIMA (Branca) -->
            <button class="up-chevron" id="up-chevron">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>

            <!-- Setas de Navegação do Carrossel (Brancas) -->
            <button class="carousel-nav-arrow left" id="carousel-prev-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <div class="carousel-track" id="director-carousel-track"></div>

            <button class="carousel-nav-arrow right" id="carousel-next-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-left">
            <div class="text">creative<br>production<br>house.</div>
            <div class="red-line"></div>
        </div>
        <div class="footer-right">
            <span class="copyright">all rights reserved ©</span>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="scriptdirectors.js"></script>

</body>
</html>
