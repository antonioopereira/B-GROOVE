<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Groove - Directors</title>
    <link rel="icon" type="image/svg+xml" href="Asset 1.svg">
    
    <!-- CSS Global do Menu -->
    <link rel="stylesheet" href="nav.css">
    
    <!-- CSS Específico da Página -->
    <link rel="stylesheet" href="styledirectors.css">
</head>
<body>

    <!-- MENU GLOBAL (Overlay) -->
    <div class="nav-overlay" id="nav-overlay">
        <button class="nav-close" id="nav-close" aria-label="Fechar menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>
        <nav class="nav-content">
            <a href="index.html" aria-label="Home">
                <div class="nav-logo"></div>
            </a>
            <a href="directors.html" class="active">directors</a>
            <a href="photographers.html">photographers</a>
            <a href="filmtv.html">film & tv</a>
            <a href="international.html">international</a>
            <a href="https://spritz.com.br/" target="_blank" rel="noopener">spritz</a>
            <a href="us.html">us.</a>
            <a href="contact.html">contact</a>
        </nav>
    </div>

    <!-- Top Bar -->
    <header class="top-bar">
        <button class="back-to-menu" id="back-to-menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to directors
        </button>

        <button class="logo-toggle-btn" id="logo-toggle" aria-label="Abrir menu">
            <img src="Asset 1.svg" alt="B Groove Logo">
        </button>
        
        <a href="us.html" class="about-link">ABOUT</a>
    </header>

    <!-- Vídeo de fundo aleatório (Menu Inicial) -->
    <div class="menu-bg-video" id="menu-bg-video"></div>

    <!-- Submenu de Diretores (Menu Inicial) -->
    <nav class="directors-submenu" id="directors-submenu">
        <a href="#" class="director-link" data-director="andre-chitas">André Chitas</a>
        <a href="#" class="director-link" data-director="goncalo-xz">Gonçalo Xz</a>
        <a href="#" class="director-link" data-director="ines-monteiro">Inês Monteiro</a>
        <a href="#" class="director-link" data-director="francisco-ramalho">Francisco Ramalho</a>
    </nav>

    <!-- Visão do Diretor (Player Fullscreen + Carrossel) -->
    <div class="director-view" id="director-view">
        
        <div class="video-section">
            
            <div class="main-iframe-wrapper" id="main-iframe-wrapper"></div>

            <!-- CAMADA DE CLIQUE NO FUNDO (NOVO) -->
            <div class="video-click-overlay" id="video-click-overlay"></div>

            <!-- Callouts fixos -->
            <div class="side-callout left">call a friend.</div>
            <div class="side-callout right">call a friend.</div>

            <!-- Setas de Navegação do Vídeo Principal -->
            <button class="nav-arrow left-arrow" id="prev-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <button class="nav-arrow right-arrow" id="next-btn">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <!-- Informação Central (Clicável) -->
            <div class="video-info-center" id="video-info-center">
                <div class="dir-name" id="main-dir-name">Dir.<br>André Chitas</div>
                <div class="brand-name" id="main-brand-name">Marca</div>
            </div>

            <!-- Carrossel de Miniaturas (Embutido) -->
            <div class="inline-carousel-container">
                <div class="carousel-track" id="director-carousel-track"></div>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-left">
            <div class="text">creative<br>production<br>house.</div>
            <div class="red-line"></div>
        </div>
        <div class="footer-right">
            <span class="copyright">all rights reserved ©</span>
        </div>
    </footer>

    <!-- PLAYER FULLSCREEN (MODAL) (NOVO) -->
    <div id="video-modal" class="video-modal">
        <button class="video-modal-close" id="video-modal-close" aria-label="Fechar vídeo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>
        <div class="video-modal-wrapper" id="video-modal-wrapper"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="nav.js"></script>
    <script src="scriptdirectors.js"></script>

</body>
</html>
